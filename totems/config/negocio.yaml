# Datos del negocio y del taller. Las habilidades en .claude/skills/ leen este archivo.
negocio:
  nombre: "Ajolote de Bolsillo"
  lema: "Tú lo imaginas, nosotros lo imprimimos"
  web: "https://ajolotedebolsillo.mitiendanube.com"
  instagram: "https://instagram.com/ajolote_de_bolsillo"
  whatsapp: "https://wa.me/523111675907"
  facebook: "https://www.facebook.com/share/1FnDfJj7tB/"

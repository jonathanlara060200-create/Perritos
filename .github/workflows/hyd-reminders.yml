name: Recordatorios de hidratación (manual)
# Los recordatorios automáticos ahora los dispara Cloudflare cada 15 min (ver custom-worker.js y
# "triggers" en wrangler.jsonc). Este workflow queda solo para lanzarlos a mano si hace falta.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de recordatorios
        env:
          URL: ${{ secrets.HYD_CRON_URL }}
          SECRET: ${{ secrets.HYD_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "Sin configurar (HYD_CRON_URL / HYD_CRON_SECRET). Nada que hacer."; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $SECRET" "$URL"
